<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJ UV Scaler</title><style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        margin: 0;
        background: #111;
        color: white;
    }

    .box {
        max-width: 500px;
        margin: auto;
    }

    h2 {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 12px;
    }

    input,
    button,
    .download-link {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        box-sizing: border-box;
        border-radius: 6px;
        font-size: 16px;
    }

    input {
        background: #222;
        color: white;
        border: 1px solid #555;
    }

    button,
    .download-link {
        background: #444;
        color: white;
        border: none;
        text-align: center;
        text-decoration: none;
        display: block;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.5;
    }

    .download-link {
        display: none;
        background: #176b3a;
    }

    #status {
        margin-top: 15px;
        line-height: 1.5;
        white-space: pre-line;
    }
</style>

</head><body><div class="box"><h2>OBJ UV Scaler</h2>

<label>Pilih File OBJ</label>

<input
    type="file"
    id="objFile"
    accept=".obj"
>

<label>Scale U</label>

<input
    type="number"
    id="scaleU"
    value="1"
    step="0.01"
>

<label>Scale V</label>

<input
    type="number"
    id="scaleV"
    value="1"
    step="0.01"
>

<button
    id="processBtn"
    onclick="processOBJ()">
    PROSES UV
</button>

<a
    id="downloadBtn"
    class="download-link">
    DOWNLOAD OBJ
</a>

<p id="status">
    Belum ada file yang diproses.
</p>

</div><script>

let hasilOBJ = null;
let namaFile = "hasil_UV.obj";
let downloadURL = null;


function processOBJ() {

    const fileInput =
        document.getElementById("objFile");

    const scaleU =
        parseFloat(
            document.getElementById("scaleU").value
        );

    const scaleV =
        parseFloat(
            document.getElementById("scaleV").value
        );

    const status =
        document.getElementById("status");

    const downloadBtn =
        document.getElementById("downloadBtn");


    // Cek file
    if (!fileInput.files.length) {

        status.innerText =
            "Pilih file OBJ terlebih dahulu.";

        return;
    }


    // Cek angka
    if (
        !Number.isFinite(scaleU) ||
        !Number.isFinite(scaleV)
    ) {

        status.innerText =
            "Scale U dan Scale V harus berupa angka.";

        return;
    }


    const file =
        fileInput.files[0];


    status.innerText =
        "Sedang membaca OBJ...";


    const reader =
        new FileReader();


    reader.onload = function(event) {

        const text =
            event.target.result;


        const lines =
            text.split(/\r?\n/);


        const result = [];


        let jumlahUV = 0;


        for (const line of lines) {

            const trimmed =
                line.trim();


            // Cari baris UV OBJ
            if (
                trimmed.startsWith("vt ") ||
                trimmed.startsWith("vt\t")
            ) {

                const parts =
                    trimmed.split(/\s+/);


                // Minimal:
                // vt U V
                if (parts.length >= 3) {

                    const u =
                        parseFloat(parts[1]);

                    const v =
                        parseFloat(parts[2]);


                    if (
                        Number.isFinite(u) &&
                        Number.isFinite(v)
                    ) {

                        const newU =
                            u * scaleU;

                        const newV =
                            v * scaleV;


                        // Pertahankan W
                        // jika OBJ memilikinya
                        if (parts.length >= 4) {

                            result.push(
                                "vt " +
                                newU +
                                " " +
                                newV +
                                " " +
                                parts[3]
                            );

                        } else {

                            result.push(
                                "vt " +
                                newU +
                                " " +
                                newV
                            );

                        }


                        jumlahUV++;

                    } else {

                        result.push(line);

                    }

                } else {

                    result.push(line);

                }

            } else {

                // Semua baris lain tetap
                result.push(line);

            }
        }


        // Gabungkan kembali OBJ
        hasilOBJ =
            result.join("\n");


        // Nama file hasil
        namaFile =
            file.name.replace(
                /\.obj$/i,
                "_UV.obj"
            );


        // Hapus URL download sebelumnya
        if (downloadURL) {

            URL.revokeObjectURL(
                downloadURL
            );

        }


        // Buat file baru
        const blob =
            new Blob(
                [hasilOBJ],
                {
                    type:
                        "text/plain;charset=utf-8"
                }
            );


        // Buat URL download
        downloadURL =
            URL.createObjectURL(blob);


        // Siapkan tombol download
        downloadBtn.href =
            downloadURL;

        downloadBtn.download =
            namaFile;

        downloadBtn.style.display =
            "block";


        status.innerText =
            "OBJ berhasil diproses.\n" +
            "UV yang diubah: " +
            jumlahUV +
            "\n" +
            "File: " +
            namaFile +
            "\n\n" +
            "Tekan DOWNLOAD OBJ.";


    };


    reader.onerror = function() {

        status.innerText =
            "Gagal membaca file OBJ.";

    };


    reader.readAsText(file);
}

</script></body>
</html>
